# ZAP api-scan rule overrides for Tennisly public JSON API.
# Format: ruleId<TAB>action<TAB>optional note
# Actions: IGNORE | INFO | WARN | FAIL
# Generate a full template anytime with: make zap-rules-gen
#
# Browser-only controls are noise on an API-key JSON surface; keep FAIL for
# injection / auth / server-leak class findings.

