server:
  port: ${SERVER_PORT:18085}
spring:
  application:
    name: replay-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB_REPLAY:tennisly_replay}
    username: ${POSTGRES_USER:tennisly}
    password: ${POSTGRES_PASSWORD:tennisly_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19094}
    consumer:
      group-id: replay-service-group
      auto-offset-reset: earliest
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:18761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
replay:
  clients:
    match-service-uri: ${REPLAY_MATCH_SERVICE_URI:http://match-service}
    tennis-data-service-uri: ${REPLAY_TENNIS_DATA_SERVICE_URI:http://tennis-data-service}
    connect-timeout: ${REPLAY_CLIENT_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${REPLAY_CLIENT_READ_TIMEOUT:PT10S}
  engine:
    frames-per-second: ${REPLAY_ENGINE_FPS:60}
    integration-step-seconds: ${REPLAY_ENGINE_STEP:0.002}
    max-flight-seconds: ${REPLAY_ENGINE_MAX_FLIGHT:6.0}
    solver-max-iterations: ${REPLAY_ENGINE_SOLVER_ITERATIONS:48}
    solver-tolerance-metres: ${REPLAY_ENGINE_SOLVER_TOLERANCE:0.05}
    max-rally-length: ${REPLAY_ENGINE_MAX_RALLY:40}
  storage:
    endpoint: ${REPLAY_STORAGE_ENDPOINT:http://localhost:19000}
    region: ${REPLAY_STORAGE_REGION:us-east-1}
    bucket: ${REPLAY_STORAGE_BUCKET:tennisly-replays}
    access-key: ${REPLAY_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${REPLAY_STORAGE_SECRET_KEY:minioadmin}
    path-style-access: ${REPLAY_STORAGE_PATH_STYLE:true}
    auto-create-bucket: ${REPLAY_STORAGE_AUTO_CREATE_BUCKET:true}
