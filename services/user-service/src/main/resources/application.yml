server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_USERS:tennisly_users}${POSTGRES_URL_PARAMS:}
    username: ${POSTGRES_USER:tennisly}
    password: ${POSTGRES_PASSWORD:tennisly_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_POOL_MAX:10}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
tennisly:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:}
  kafka:
    enabled: ${TENNISLY_KAFKA_ENABLED:true}
  clients:
    notification-service-uri: ${NOTIFICATION_SERVICE_URI:}
  webhooks:
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    allow-private-targets: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:true}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:true}
