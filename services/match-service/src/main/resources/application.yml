server:
  port: ${SERVER_PORT:18084}
spring:
  application:
    name: match-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB_MATCHES:tennisly_matches}
    username: ${POSTGRES_USER:tennisly}
    password: ${POSTGRES_PASSWORD:tennisly_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 2s
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19094}
    producer:
      acks: all
      retries: 3
tennisly:
  websocket:
    allowed-origins: ${MATCH_SERVICE_WS_ALLOWED_ORIGINS:http://localhost:3000}
  clients:
    tennis-data-service-uri: ${TENNIS_DATA_SERVICE_URI:http://localhost:18083}
  ingest:
    enabled: ${MATCH_INGEST_ENABLED:true}
    live-fixed-delay-ms: ${MATCH_INGEST_LIVE_DELAY_MS:60000}
    completed-fixed-delay-ms: ${MATCH_INGEST_COMPLETED_DELAY_MS:21600000}
    page-size: ${MATCH_INGEST_PAGE_SIZE:50}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:18761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:true}
