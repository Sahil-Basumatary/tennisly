server:
  port: ${SERVER_PORT:18084}
spring:
  application:
    name: match-service
  datasource:
    # POSTGRES_URL_PARAMS carries managed-provider requirements (Neon needs ?sslmode=require).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB_MATCHES:tennisly_matches}${POSTGRES_URL_PARAMS:}
    username: ${POSTGRES_USER:tennisly}
    password: ${POSTGRES_PASSWORD:tennisly_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Serverless Postgres bills and caps connections; local dev keeps the Hikari default.
      maximum-pool-size: ${POSTGRES_POOL_MAX:10}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 2s
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19094}
    producer:
      acks: all
      retries: 3
tennisly:
  websocket:
    allowed-origins: ${MATCH_SERVICE_WS_ALLOWED_ORIGINS:http://localhost:3000}
    redis-channel: ${MATCH_LIVE_REDIS_CHANNEL:match-live-events}
    send-time-limit-ms: ${MATCH_WS_SEND_TIME_LIMIT_MS:500}
    send-buffer-limit-bytes: ${MATCH_WS_SEND_BUFFER_BYTES:16384}
    outbound-pool-size: ${MATCH_WS_OUTBOUND_POOL:16}
    outbound-queue-capacity: ${MATCH_WS_OUTBOUND_QUEUE:20000}
  clients:
    tennis-data-service-uri: ${TENNIS_DATA_SERVICE_URI:http://localhost:18083}
    notification-service-uri: ${NOTIFICATION_SERVICE_URI:}
    analytics-service-uri: ${ANALYTICS_SERVICE_URI:}
    replay-service-uri: ${REPLAY_SERVICE_URI:}
  ingest:
    enabled: ${MATCH_INGEST_ENABLED:true}
    live-fixed-delay-ms: ${MATCH_INGEST_LIVE_DELAY_MS:60000}
    completed-fixed-delay-ms: ${MATCH_INGEST_COMPLETED_DELAY_MS:21600000}
    page-size: ${MATCH_INGEST_PAGE_SIZE:50}
  # Same secret the gateway presents; blank locally so make up stays open.
  internal-token: ${GATEWAY_INTERNAL_TOKEN:}
  kafka:
    enabled: ${TENNISLY_KAFKA_ENABLED:true}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:18761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:true}
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
