server:
  port: 8888
spring:
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/YOUR_USERNAME/tennisly-config.git}
          default-label: main
          clone-on-start: true
          timeout: 10
  security:
    user:
      name: ${CONFIG_SERVER_USER:configadmin}
      password: ${CONFIG_SERVER_PASSWORD:configsecret}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
logging:
  level:
    org.springframework.cloud.config: INFO

