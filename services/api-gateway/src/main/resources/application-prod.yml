# Activate with: SPRING_PROFILES_ACTIVE=prod
tennisly:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  api-key-auth:
    rate-limit-fail-open: ${RATE_LIMIT_FAIL_OPEN:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    gateway:
      enabled: false
logging:
  level:
    org.springframework.cloud.gateway: WARN
    root: INFO
