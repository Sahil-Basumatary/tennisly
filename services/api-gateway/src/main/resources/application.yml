server:
  port: 8080
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CLERK_JWKS_URI:https://trusting-toucan-94.clerk.accounts.dev/.well-known/jwks.json}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: tennis-data-service
          uri: lb://tennis-data-service
          predicates:
            - Path=/api/tennis/**
        - id: match-service
          uri: lb://match-service
          predicates:
            - Path=/api/matches/**
        - id: match-service-websocket
          uri: lb:ws://match-service
          predicates:
            - Path=/ws/matches/**
        - id: court-service
          uri: lb://court-service
          predicates:
            - Path=/api/courts/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
        - id: public-api-v1-tennis
          uri: lb://tennis-data-service
          predicates:
            - Path=/api/v1/players/**,/api/v1/rankings/**,/api/v1/tournaments/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/tennis/${segment}
        - id: public-api-v1-matches
          uri: lb://match-service
          predicates:
            - Path=/api/v1/matches/**
          filters:
            - RewritePath=/api/v1/matches(?<segment>/?.*), /api/matches${segment}
        - id: public-api-v1-webhooks
          uri: lb://user-service
          predicates:
            - Path=/api/v1/webhooks/**
          filters:
            - RewritePath=/api/v1/webhooks(?<segment>/?.*), /api/users/public/webhooks${segment}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      enabled: false
logging:
  level:
    org.springframework.cloud.gateway: INFO
tennisly:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  api-key-auth:
    user-service-uri: ${USER_SERVICE_URI:http://user-service}
    connect-timeout: 2s
    read-timeout: 5s
    rate-limit-fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    rate-limits:
      free: 30
      basic: 120
      pro: 600
      enterprise: 3000

