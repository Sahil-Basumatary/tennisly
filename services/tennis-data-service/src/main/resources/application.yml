server:
  port: 8083
spring:
  application:
    name: tennis-data-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_TENNIS_DATA:tennisly_tennis_data}
    username: ${POSTGRES_USER:tennisly}
    password: ${POSTGRES_PASSWORD:tennisly_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      retries: 3
tennis:
  data:
    provider: ${TENNIS_DATA_PROVIDER:mock}
    balldontlie:
      base-url: ${TENNIS_BALLDONTLIE_BASE_URL:https://api.balldontlie.io}
      api-key: ${TENNIS_BALLDONTLIE_API_KEY:}
      max-pages: ${TENNIS_BALLDONTLIE_MAX_PAGES:5}
      max-attempts: ${TENNIS_BALLDONTLIE_MAX_ATTEMPTS:3}
      requests-per-minute: ${TENNIS_BALLDONTLIE_REQUESTS_PER_MINUTE:5}
      circuit-breaker:
        failure-threshold: ${TENNIS_BALLDONTLIE_FAILURE_THRESHOLD:5}
        open-duration: ${TENNIS_BALLDONTLIE_OPEN_DURATION:PT2M}
    sync:
      enabled: ${TENNIS_DATA_SYNC_ENABLED:true}
      players-cron: ${TENNIS_DATA_SYNC_PLAYERS_CRON:0 0 2 * * *}
      tournaments-cron: ${TENNIS_DATA_SYNC_TOURNAMENTS_CRON:0 30 2 * * *}
      rankings-cron: ${TENNIS_DATA_SYNC_RANKINGS_CRON:0 0 */6 * * *}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
