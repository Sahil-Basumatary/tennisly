server:
  port: ${SERVER_PORT:18083}
spring:
  application:
    name: tennis-data-service
  datasource:
    # POSTGRES_URL_PARAMS carries managed-provider requirements (Neon needs ?sslmode=require).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB_TENNIS_DATA:tennisly_tennis_data}${POSTGRES_URL_PARAMS:}
    username: ${POSTGRES_USER:tennisly}
    password: ${POSTGRES_PASSWORD:tennisly_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Serverless Postgres bills and caps connections; local dev keeps the Hikari default.
      maximum-pool-size: ${POSTGRES_POOL_MAX:10}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 2s
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19094}
    producer:
      acks: all
      retries: 3
tennis:
  data:
    provider: ${TENNIS_DATA_PROVIDER:balldontlie}
    balldontlie:
      base-url: ${TENNIS_BALLDONTLIE_BASE_URL:https://api.balldontlie.io}
      api-key: ${TENNIS_BALLDONTLIE_API_KEY:}
      max-pages: ${TENNIS_BALLDONTLIE_MAX_PAGES:5}
      max-attempts: ${TENNIS_BALLDONTLIE_MAX_ATTEMPTS:3}
      per-page: ${TENNIS_BALLDONTLIE_PER_PAGE:100}
      requests-per-minute: ${TENNIS_BALLDONTLIE_REQUESTS_PER_MINUTE:5}
      circuit-breaker:
        failure-threshold: ${TENNIS_BALLDONTLIE_FAILURE_THRESHOLD:5}
        open-duration: ${TENNIS_BALLDONTLIE_OPEN_DURATION:PT2M}
    livetennis:
      base-url: ${TENNIS_LIVETENNIS_BASE_URL:https://api.livetennisapi.com/api/public/v1}
      api-key: ${TENNIS_LIVETENNIS_API_KEY:}
      max-attempts: ${TENNIS_LIVETENNIS_MAX_ATTEMPTS:3}
      requests-per-minute: ${TENNIS_LIVETENNIS_REQUESTS_PER_MINUTE:60}
      circuit-breaker:
        failure-threshold: ${TENNIS_LIVETENNIS_FAILURE_THRESHOLD:5}
        open-duration: ${TENNIS_LIVETENNIS_OPEN_DURATION:PT2M}
    sync:
      enabled: ${TENNIS_DATA_SYNC_ENABLED:true}
      players-cron: ${TENNIS_DATA_SYNC_PLAYERS_CRON:0 0 2 * * *}
      tournaments-cron: ${TENNIS_DATA_SYNC_TOURNAMENTS_CRON:0 30 2 * * *}
      rankings-cron: ${TENNIS_DATA_SYNC_RANKINGS_CRON:0 0 */6 * * *}
    seed:
      on-startup: ${TENNIS_DATA_SEED_ON_STARTUP:true}
tennisly:
  # Blank locally; set GATEWAY_INTERNAL_TOKEN on Render so public URLs stay locked.
  internal-token: ${GATEWAY_INTERNAL_TOKEN:}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:18761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:true}
