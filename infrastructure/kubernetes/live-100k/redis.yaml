apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tennisly-live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxclients", "50000"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tennisly-live
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
